[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taskloom"
version = "0.1.0"
description = "A constrained multi-agent task orchestration system built with LangGraph."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.11,<3.0",
    "python-dotenv>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=1.2,<2.0",
]

[project.scripts]
taskloom = "app.main:main"
taskloom-plan = "app.agents.planner_cli:main"
taskloom-worker = "app.workers.worker_cli:main"
taskloom-run = "app.graph.runtime_cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
